name: Docker Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".agents/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (for example v2026.3.22)
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('docker-release-manual-{0}', inputs.tag) || format('docker-release-push-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "${SOURCE_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE}:main")
          fi
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
            tags+=("${IMAGE}:${version}")
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
              tags+=("${IMAGE}:latest")
            fi
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::No tags resolved for ref ${SOURCE_REF}"
            exit 1
          fi
          tag_args=""
          for tag in "${tags[@]}"; do
            tag_args="${tag_args} -t ${tag}"
          done
          echo "value=${tag_args}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg OPENCLAW_EXTENSIONS="ecs msteams" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'main' }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ${{ steps.tags.outputs.value }} \
            --push \
            .

  notify-aab:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Notify agentic-app-builder
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AAB_DISPATCH_TOKEN }}
          repository: peaktechsim/agentic-app-builder
          event-type: image-updated
          client-payload: '{"tag": "${{ github.sha }}", "image": "ghcr.io/claytown/openclaw", "source_repo": "openclaw"}'
